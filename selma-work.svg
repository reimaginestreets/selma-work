<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- eye stalks -->
  <path d="M52.5 28 L50 18.5 M57.5 28 L60 18.5" stroke="#5F7A6B" stroke-width="2"/>
  <circle cx="49.8" cy="17.5" r="2.2" fill="#5F7A6B"/>
  <circle cx="60.2" cy="17.5" r="2.2" fill="#5F7A6B"/>
  <!-- body -->
  <path d="M5 53 Q5 47 12 47 L43 47 Q49 47 49 40 L49 33 Q49 26.5 55 26.5 Q61 26.5 61 33 L61 44 Q61 56 49 56 L9 56 Q5 56 5 53 Z" fill="#B9CBBE" stroke="#5F7A6B" stroke-width="2"/>
  <!-- smile + cheek -->
  <path d="M54.5 36.5 Q56.3 38.3 58.2 36.5" stroke="#5F7A6B" stroke-width="1.6"/>
  <circle cx="53" cy="34.5" r="1.3" fill="#E3B7A0"/>
  <!-- spiral-bound notebook shell, open to one page -->
  <rect x="11" y="14" width="33" height="33" rx="4" fill="#FFFDFA" stroke="#5F7A6B" stroke-width="2"/>
  <!-- ruled lines -->
  <path d="M16 24.5 H39 M16 30 H39 M16 35.5 H31 M16 41 H27" stroke="#5F7A6B" stroke-width="1.4" opacity=".5"/>
  <!-- the coil along the top -->
  <path d="M16 18 V11 M21.5 18 V11 M27 18 V11 M32.5 18 V11 M38 18 V11" stroke="#5F7A6B" stroke-width="2"/>
  <!-- fountain pen resting on the page -->
  <path d="M33 41 L41.5 30.5" stroke="#C98B6B" stroke-width="3.2"/>
  <path d="M33 41 L31.2 43.6" stroke="#5F7A6B" stroke-width="1.6"/>
</svg>
